<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema EPJ PCSP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 3rem 2.5rem;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #eaeaea;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #212529;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: #6c757d;
            font-size: 0.95rem;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid #ced4da;
            background-color: #fcfcfc;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #495057;
            background-color: #ffffff;
        }
        .btn-login {
            background-color: #212529;
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #343a40;
            color: #ffffff;
        }
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            color: #adb5bd;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Sistema EPJ PCSP</h1>
            <p>Acesso restrito</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category=='danger' else 'warning' }} alert-dismissible fade show" role="alert" style="font-size: 0.9rem;">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-login w-100">Entrar no Sistema</button>
        </form>

        <div class="login-footer">
            Ambiente seguro e criptografado<br>
            © 2025 Sistema EPJ PCSP
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
