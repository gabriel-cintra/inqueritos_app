{% extends "base.html" %}

{% block title %}Editar Inquérito{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="m-0">
                        <i class="bi bi-pencil"></i> Editar Inquérito #{{ inquerito.num_controle or inquerito.id }}
                    </h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('inqueritos.editar', id=inquerito.id) }}" method="POST" class="row g-3">
                        <div class="col-md-4">
                            <label for="num_controle" class="form-label">Nº Controle *</label>
                            <input type="text" id="num_controle" name="num_controle" 
                                   value="{{ inquerito.num_controle or '' }}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="num_eletronico" class="form-label">Nº Eletrônico *</label>
                            <input type="text" id="num_eletronico" name="num_eletronico" 
                                   value="{{ inquerito.num_eletronico }}" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label for="ano" class="form-label">Ano *</label>
                            <input type="number" id="ano" name="ano" 
                                   value="{{ inquerito.ano }}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="num_processo" class="form-label">Nº Processo</label>
                            <input type="text" id="num_processo" name="num_processo" 
                                   value="{{ inquerito.num_processo or '' }}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="delegacia" class="form-label">Delegacia</label>
                            <input type="text" id="delegacia" name="delegacia" 
                                   value="{{ inquerito.delegacia or '' }}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="data_conclusao" class="form-label">Data Conclusão</label>
                            <input type="date" id="data_conclusao" name="data_conclusao" 
                                   value="{{ data_conclusao_iso }}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="status" class="form-label">Status</label>
                            <input type="text" id="status" name="status" 
                                   value="{{ inquerito.status or 'Em Cartório' }}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="equipe" class="form-label">Equipe</label>
                            <select id="equipe" name="equipe" class="form-select">
                                <option value="">Selecione...</option>
                                <option value="EPJ 1" {% if inquerito.equipe == 'EPJ 1' %}selected{% endif %}>EPJ 1</option>
                                <option value="EPJ 2 - CINTRA" {% if inquerito.equipe == 'EPJ 2 - CINTRA' %}selected{% endif %}>EPJ 2 - CINTRA</option>
                                <option value="EPJ 3" {% if inquerito.equipe == 'EPJ 3' %}selected{% endif %}>EPJ 3</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="is_cota" name="is_cota" 
                                       {% if inquerito.is_cota %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-danger" for="is_cota">
                                    <i class="bi bi-exclamation-triangle"></i> É Cota? (Retorno da Justiça)
                                </label>
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-grow-1">
                                    <i class="bi bi-save"></i> Salvar Alterações
                                </button>
                                <a href="{{ url_for('inqueritos.index') }}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
